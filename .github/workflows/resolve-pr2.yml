name: Resolve PR2 merge

on:
  push:
    branches:
      - ops/resolve-pr2

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: test/property-testing-speedup
          fetch-depth: 0

      - name: Merge main, resolve lockfile, and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-edit origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            echo "Conflicts detected:"
            printf '%s\n' "$conflicts"
            if [ "$conflicts" != "package-lock.json" ]; then
              echo "Unexpected conflict set; refusing automatic resolution."
              exit 1
            fi

            # Cargo.lock and apps/web/package.json merge cleanly. Start from
            # main's npm lockfile, then regenerate it from the merged manifests
            # so it contains both MCP and fast-check dependency graphs.
            git checkout --theirs package-lock.json
            npm install --package-lock-only --ignore-scripts
            git add package-lock.json
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          grep -q '"@modelcontextprotocol/sdk"' apps/web/package.json
          grep -q '"fast-check"' apps/web/package.json
          grep -q '^proptest = ' Cargo.toml
          grep -q '^proptest.workspace = true' crates/oristudio-cp/Cargo.toml

          # Validate that both regenerated/auto-merged lockfiles are internally
          # consistent without invoking project build hooks.
          npm ci --ignore-scripts
          cargo check -p oristudio-cp --tests --locked

          if [ "$merge_rc" -ne 0 ]; then
            git commit -m "merge main into test/property-testing-speedup"
          fi

          git push origin HEAD:test/property-testing-speedup
