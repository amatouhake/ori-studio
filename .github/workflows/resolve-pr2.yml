name: Resolve PR2 merge

on:
  push:
    branches:
      - ops/resolve-pr2

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: test/property-testing-speedup
          fetch-depth: 0

      - name: Merge main and regenerate lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-edit origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -eq 0 ]; then
            echo "Merge completed without conflicts."
          else
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' Cargo.lock apps/web/package.json package-lock.json | sort)"
            echo "Conflicts detected:"
            printf '%s\n' "$conflicts"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflict set; refusing automatic resolution."
              exit 1
            fi

            git checkout --theirs apps/web/package.json
            node <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.devDependencies ||= {};
          pkg.devDependencies['fast-check'] = '^4.10.0';
          pkg.devDependencies = Object.fromEntries(Object.entries(pkg.devDependencies).sort(([a], [b]) => a.localeCompare(b)));
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
            git add apps/web/package.json

            git checkout --theirs package-lock.json Cargo.lock
            npm install --package-lock-only --ignore-scripts
            cargo check -p oristudio-cp --tests
            git add package-lock.json Cargo.lock
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          grep -q '"@modelcontextprotocol/sdk"' apps/web/package.json
          grep -q '"fast-check"' apps/web/package.json
          grep -q '^proptest = ' Cargo.toml
          grep -q '^proptest.workspace = true' crates/oristudio-cp/Cargo.toml

          if ! git diff --cached --quiet || [ "$merge_rc" -ne 0 ]; then
            git commit -m "merge main into test/property-testing-speedup"
          fi

          git push origin HEAD:test/property-testing-speedup
